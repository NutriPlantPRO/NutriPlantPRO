<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="assets/free-tools-watermark.css" />
  <script src="assets/np-prefs-bootstrap.js"></script>
  <script src="assets/np-prefs.js"></script>
  <script src="assets/np-i18n.js?v=20260730a"></script>

  <title>Uniformidad de riego — NutriPlant PRO</title>
  <style>
    body { margin: 0; padding: 16px; background: #f8fafc; font-family: Inter, system-ui, sans-serif; }
    .wrap { position: relative; background: #fff; border-radius: 12px; padding: 16px; }
    html.embed-login .np-free-tool-head { display: none; }
    html.embed-login body { padding: 12px 14px 16px; }
    .title { margin: 0 0 8px; font-size: 22px; color: #0f766e; font-weight: 800; }
    .intro { margin: 0 0 16px; font-size: 13px; line-height: 1.5; color: #64748b; }
    .card { border-radius: 12px; padding: 16px; margin-bottom: 16px; border: 1px solid #99f6e4; background: #fff; }
    .card-note { background: #f8fafc; border: 1px solid #e2e8f0; font-size: 12px; color: #64748b; }
    .tabs { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
    .tab {
      padding: 8px 14px; border-radius: 999px; border: 1px solid #99f6e4; background: #fff;
      font-size: 13px; font-weight: 700; cursor: pointer; color: #0f766e;
    }
    .tab.active { background: #0f766e; color: #fff; border-color: #0f766e; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 12px 10px;
      align-items: stretch;
    }
    .field {
      display: flex;
      flex-direction: column;
      min-width: 0;
      height: 100%;
    }
    .field label {
      display: block;
      min-height: 2.6em;
      margin: 0 0 6px;
      font-size: 12px;
      font-weight: 600;
      color: #475569;
      line-height: 1.3;
      overflow-wrap: break-word;
    }
    .field label [data-np-unit-label] {
      white-space: nowrap;
      font-weight: 700;
      color: #0f766e;
    }
    .field input, .field select {
      width: 100%;
      margin-top: auto;
      padding: 8px 10px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 14px;
      box-sizing: border-box;
      min-height: 38px;
    }
    .kinds { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; margin: 8px 0 12px; }
    .kind {
      display: flex; align-items: flex-start; gap: 8px; padding: 10px 12px;
      border: 2px solid #ccfbf1; border-radius: 10px; cursor: pointer; background: #f0fdfa;
      font-size: 13px; font-weight: 700; color: #115e59;
    }
    .kind input { margin-top: 2px; }
    .kind.active { border-color: #0d9488; background: #ccfbf1; }
    .kind span { display: block; font-size: 11px; font-weight: 500; color: #64748b; }
    .btn {
      padding: 8px 12px; border-radius: 8px; border: 1px solid #cbd5e1; background: #fff;
      font-size: 13px; font-weight: 600; cursor: pointer; color: #0f172a;
    }
    .btn-primary {
      background: linear-gradient(180deg, #14b8a6 0%, #0f766e 100%);
      color: #fff; border-color: #0f766e;
    }
    .btn-ghost { color: #b91c1c; border-color: #fecaca; }
    .row-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
    .lot {
      border: 2px solid #99f6e4; border-radius: 12px; padding: 14px; margin-bottom: 14px; background: #f0fdfa;
    }
    .lot-head { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 10px; }
    .lot-head input.title-in {
      flex: 1; min-width: 140px; font-size: 16px; font-weight: 800; color: #0f766e;
      border: 0; border-bottom: 2px dashed #5eead4; background: transparent; padding: 4px 2px;
    }
    table.samples {
      width: max(100%, 34rem);
      min-width: 34rem;
      table-layout: auto;
      border-collapse: collapse;
      font-size: 12px;
      background: #fff;
      border-radius: 8px;
    }
    table.samples col.c-idx { width: 7.5rem; }
    table.samples col.c-lectura { width: 11rem; }
    table.samples col.c-q { width: 6.5rem; }
    table.samples col.c-pct { width: 5.5rem; }
    table.samples col.c-del { width: 44px; }
    table.samples th, table.samples td {
      padding: 6px 8px;
      border-bottom: 1px solid #e2e8f0;
      text-align: left;
      vertical-align: middle;
      white-space: nowrap;
    }
    table.samples th { background: #ccfbf1; color: #115e59; font-weight: 700; }
    table.samples th.th-q,
    table.samples td[data-q],
    table.samples th.th-pct,
    table.samples td[data-p] {
      text-align: right;
      font-variant-numeric: tabular-nums;
    }
    table.samples td.idx-cell {
      font-weight: 700;
      color: #0f766e;
      white-space: nowrap;
    }
    table.samples td.del-cell {
      text-align: center;
      padding-left: 4px;
      padding-right: 4px;
    }
    .lectura-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      max-width: 100%;
    }
    .lectura-wrap input {
      width: 5.5rem;
      min-width: 4.5rem;
      max-width: 7rem;
      flex: 0 0 auto;
      padding: 6px 8px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      box-sizing: border-box;
    }
    .lectura-unit {
      display: inline-block;
      flex: 0 0 auto;
      font-size: 12px;
      font-weight: 800;
      color: #0f766e;
      letter-spacing: 0.01em;
      white-space: nowrap;
    }
    .table-wrap {
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      max-width: 100%;
      overscroll-behavior-x: contain;
    }
    table.samples tr.low td { background: #fef2f2; }
    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(132px, 1fr));
      gap: 8px;
      margin-top: 12px;
      align-items: stretch;
    }
    .stat {
      background: #fff;
      border: 1px solid #ccfbf1;
      border-radius: 10px;
      padding: 10px;
      min-width: 0;
      box-sizing: border-box;
    }
    .stat b {
      display: block;
      font-size: 17px;
      color: #0f766e;
      line-height: 1.25;
      overflow-wrap: anywhere;
      word-break: break-word;
    }
    .stat span {
      display: block;
      margin-top: 4px;
      font-size: 11px;
      color: #64748b;
      font-weight: 600;
      line-height: 1.3;
    }
    .warn { font-size: 12px; color: #b91c1c; margin: 8px 0 0; font-weight: 600; }
    .ok { font-size: 12px; color: #166534; margin: 8px 0 0; font-weight: 600; }
    .fert { margin-top: 10px; padding: 12px; background: #fffbeb; border: 1px solid #fde68a; border-radius: 10px; font-size: 13px; color: #854d0e; line-height: 1.45; }
    .hidden { display: none !important; }
    .eu-hero { font-size: 36px; font-weight: 800; color: #0f766e; margin: 8px 0; }
    .key { margin-top: 8px; padding: 12px; background: #ecfdf5; border-radius: 10px; font-size: 12px; color: #14532d; font-weight: 600; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="np-free-tool-head">
      <h2 class="title np-free-tool-title" id="ur-title">🎯 Uniformidad de riego</h2>
      <div class="np-free-watermark" aria-hidden="true"><img src="assets/N_Hoja_Azul.png" alt=""></div>
    </div>
    <p class="intro" id="ur-intro"></p>
    <div class="card card-note" id="ur-note"></div>

    <div class="tabs">
      <button type="button" class="tab active" data-tab="field" id="ur-tab-field">Campo · DU / CU</button>
      <button type="button" class="tab" data-tab="eu" id="ur-tab-eu">Diseño · EU Keller–Karmeli</button>
    </div>

    <div id="pane-field">
      <div class="card">
        <h3 style="margin:0 0 6px;color:#0f766e;font-size:16px;" id="ur-h-kind">1 · Qué mediste</h3>
        <div class="kinds">
          <label class="kind active" data-kind="flow"><input type="radio" name="ur-kind" value="flow" checked> <div id="ur-k-flow">Caudal<br><span>L/h o gal/h del gotero</span></div></label>
          <label class="kind" data-kind="volume"><input type="radio" name="ur-kind" value="volume"> <div id="ur-k-vol">Volumen captado<br><span>mL, cm³, oz, gal</span></div></label>
          <label class="kind" data-kind="depth"><input type="radio" name="ur-kind" value="depth"> <div id="ur-k-dep">Lámina<br><span>mm o pulgadas</span></div></label>
        </div>
        <div class="grid">
          <div class="field">
            <label for="ur-unit" id="ur-l-unit">Unidad de las muestras</label>
            <select id="ur-unit"></select>
          </div>
          <div class="field vol-only hidden">
            <label for="ur-min" id="ur-l-min">Tiempo de captura (min)</label>
            <input id="ur-min" type="number" step="0.1" min="0" value="15" />
          </div>
          <div class="field vol-only hidden">
            <label for="ur-area" id="ur-l-area">Área del captador (<span data-np-unit-label="small_area">cm²</span>), opcional</label>
            <input id="ur-area" type="number" step="0.1" min="0" placeholder="" />
          </div>
          <div class="field">
            <label for="ur-hours" id="ur-l-hours">Horas de riego del evento</label>
            <input id="ur-hours" type="number" step="0.1" min="0" value="1" />
          </div>
          <div class="field">
            <label for="ur-row" id="ur-l-row">Distancia entre hileras (<span data-np-unit-label="spacing">m</span>)</label>
            <input id="ur-row" type="number" step="0.01" min="0" value="" />
          </div>
          <div class="field">
            <label for="ur-emit" id="ur-l-emit">Distancia entre goteros (<span data-np-unit-label="spacing">m</span>)</label>
            <input id="ur-emit" type="number" step="0.01" min="0" value="" />
          </div>
          <div class="field">
            <label for="ur-dose" id="ur-l-dose">Dosis fertirriego prevista (<span data-np-unit-label="dose_mass_area">kg/ha</span>)</label>
            <input id="ur-dose" type="number" step="0.01" min="0" placeholder="" />
          </div>
          <div class="field">
            <label for="ur-conc" id="ur-l-conc">Concentración (<span data-np-unit-label="concentration_mass_volume">kg/m³</span>), opcional</label>
            <input id="ur-conc" type="number" step="0.001" min="0" placeholder="" />
          </div>
          <div class="field">
            <label for="ur-cvf" id="ur-l-cvf">CVf fabricante (opcional)</label>
            <input id="ur-cvf" type="number" step="0.001" min="0" placeholder="ej. 0.03" />
          </div>
          <div class="field">
            <label for="ur-ep" id="ur-l-ep">Goteros por planta ep</label>
            <input id="ur-ep" type="number" step="1" min="1" placeholder="ej. 2" />
          </div>
        </div>
        <p class="key" id="ur-hint-units"></p>
      </div>

      <div class="card">
        <div style="display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;">
          <h3 style="margin:0;color:#0f766e;font-size:16px;" id="ur-h-lots">2 · Lotes y muestras</h3>
          <div class="row-actions" style="margin:0;">
            <button type="button" class="btn" id="ur-btn-demo">Ejemplo de campo</button>
            <button type="button" class="btn btn-primary" id="ur-btn-add-lot">+ Lote</button>
          </div>
        </div>
        <p class="intro" style="margin:8px 0 12px;" id="ur-lots-help"></p>
        <div id="ur-lots"></div>
      </div>
    </div>

    <div id="pane-eu" class="hidden">
      <div class="card">
        <h3 style="margin:0 0 8px;color:#0f766e;font-size:16px;" id="ur-h-eu">Uniformidad de emisión (diseño)</h3>
        <p class="intro" id="ur-eu-intro"></p>
        <p><button type="button" class="btn" id="ur-btn-eu-ex">Cargar ejemplo (91,1 %)</button></p>
        <div class="grid">
          <div class="field"><label for="eu-qn" id="eu-l-qn">Q nominal (L/h)</label><input id="eu-qn" type="number" step="0.001" value=""></div>
          <div class="field"><label for="eu-pn" id="eu-l-pn">P nominal (MCA)</label><input id="eu-pn" type="number" step="0.01" value=""></div>
          <div class="field"><label for="eu-x" id="eu-l-x">x (exponente)</label><input id="eu-x" type="number" step="0.01" value="0.5"></div>
          <div class="field"><label for="eu-cvf" id="eu-l-cvf-des">CVf</label><input id="eu-cvf" type="number" step="0.001" value="0.03"></div>
          <div class="field"><label for="eu-ep" id="eu-l-ep-des">ep (goteros/planta)</label><input id="eu-ep" type="number" step="1" value="2"></div>
          <div class="field"><label for="eu-pin" id="eu-l-pin">P entrada válvula (MCA)</label><input id="eu-pin" type="number" step="0.01" value=""></div>
          <div class="field"><label for="eu-fmain" id="eu-l-fmain">Fricción hasta última lateral (MCA)</label><input id="eu-fmain" type="number" step="0.01" value=""></div>
          <div class="field"><label for="eu-flat" id="eu-l-flat">Fricción de la lateral (MCA)</label><input id="eu-flat" type="number" step="0.01" value=""></div>
          <div class="field"><label for="eu-slope" id="eu-l-slope">Desnivel a favor (MCA)</label><input id="eu-slope" type="number" step="0.01" value=""></div>
        </div>
        <div id="eu-out" style="margin-top:14px;"></div>
      </div>
    </div>
  </div>

  <script src="assets/np-irrigation-uniformity-core.js?v=20260914ur1"></script>
  <script src="assets/np-free-local-persist.js"></script>
  <script>
(function () {
  'use strict';
  var U = window.NpIrrigationUniformity;
  var UI = window.NpWaterClimateUI;
  var persist;
  var lots = [U.emptyLot('Lote 1', 4)];
  var tab = 'field';
  var euSi = { qnLph: 0.51, pnMca: 5.5, pinMca: 11.25, fmainMca: 2, flatMca: 1.5, slopeMca: 1 };
  var syncingEu = false;

  function prefs() {
    try {
      return window.NpPrefs && window.NpPrefs.get ? window.NpPrefs.get() : { language: 'es', unit_system: 'metric' };
    } catch (e) {
      return { language: 'es', unit_system: 'metric' };
    }
  }
  function t(es, en) {
    if (UI && typeof UI.t === 'function') return UI.t(es, en);
    return prefs().language === 'en' ? en : es;
  }
  function imperial() { return prefs().unit_system === 'us_customary'; }
  function kind() {
    var el = document.querySelector('input[name="ur-kind"]:checked');
    return el ? el.value : 'flow';
  }
  function unitsFor(k) {
    if (k === 'depth') return imperial() ? ['in', 'mm'] : ['mm', 'in'];
    if (k === 'volume') return imperial() ? ['US fl oz', 'US gal', 'mL', 'cm3', 'L'] : ['mL', 'cm3', 'L', 'US fl oz', 'US gal'];
    return imperial() ? ['gph', 'L/h'] : ['L/h', 'gph'];
  }
  function fillUnits(keep) {
    var sel = document.getElementById('ur-unit');
    var opts = unitsFor(kind());
    var cur = keep || sel.value;
    sel.innerHTML = opts.map(function (u) {
      return '<option value="' + u + '"' + (u === cur ? ' selected' : '') + '>' + u + '</option>';
    }).join('');
    if (opts.indexOf(sel.value) < 0) sel.value = opts[0];
  }
  function readBound(id, kind) {
    if (UI && typeof UI.read === 'function') {
      var v = UI.read(id, kind);
      if (v != null) return v;
    }
    var n = Number(document.getElementById(id).value);
    return Number.isFinite(n) ? n : null;
  }
  function extra() {
    return {
      kind: kind(),
      unit: document.getElementById('ur-unit').value,
      catchMinutes: document.getElementById('ur-min').value,
      catchAreaCm2: readBound('ur-area', 'small_area'),
      irrigHours: document.getElementById('ur-hours').value,
      rowM: readBound('ur-row', 'spacing'),
      emitM: readBound('ur-emit', 'spacing'),
      doseKgHa: readBound('ur-dose', 'dose_mass_area'),
      concKgM3: readBound('ur-conc', 'concentration_mass_volume'),
      cvf: document.getElementById('ur-cvf').value || null,
      ep: document.getElementById('ur-ep').value || null
    };
  }
  function sampleLabel(i) { return t('Muestra', 'Sample') + ' ' + (i + 1); }
  function fmt(v, d) {
    var n = U.round(v, d == null ? 2 : d);
    return n == null ? '—' : String(n).replace('.', t(',', '.'));
  }
  function coreErr(msg) {
    if (!msg) return '';
    if (prefs().language !== 'en') return msg;
    var map = {
      'Sin muestras numéricas.': 'Need numeric samples.',
      'La media es 0.': 'Mean is 0.',
      'CVf del fabricante inválido.': 'Invalid manufacturer CVf.',
      'Goteros por planta (ep) debe ser > 0.': 'Emitters per plant (ep) must be > 0.',
      'qmin y q medio requeridos.': 'qmin and mean q are required.',
      'Presión de entrada requerida.': 'Inlet pressure is required.'
    };
    return map[msg] || msg;
  }
  function fmtUi(valueSi, kind, digits) {
    if (valueSi == null || !Number.isFinite(Number(valueSi))) return '—';
    if (UI && UI.resultFromSI) return UI.resultFromSI(Number(valueSi), kind, digits);
    return fmt(valueSi, digits);
  }
  function fmtFlowLph(lph) {
    if (lph == null || !Number.isFinite(Number(lph))) return '—';
    if (imperial()) return fmt(Number(lph) / 3.785411784, 3) + ' gph';
    return fmt(lph, 3) + ' L/h';
  }
  function fmtPressure(mca) {
    if (mca == null || !Number.isFinite(Number(mca))) return '—';
    if (imperial()) return fmt(U.mcaToPsi(mca), 2) + ' PSI';
    return fmt(mca, 2) + ' MCA';
  }
  function fmtVolEvent(l) {
    if (l == null || !Number.isFinite(Number(l))) return '—';
    if (imperial()) return fmt(Number(l) / 3.785411784, 2) + ' gal';
    return fmt(l, 2) + ' L';
  }
  function sampleUnit() { return document.getElementById('ur-unit').value; }
  function lecturaHeader() {
    return t('Lectura', 'Reading') + ' (<span class="ur-unit-live">' + sampleUnit() + '</span>)';
  }
  function syncSampleUnitLabels() {
    var u = sampleUnit();
    document.querySelectorAll('.lectura-unit, .ur-unit-live').forEach(function (el) {
      el.textContent = u;
    });
  }
  function fmtCanonical(v) {
    if (v == null) return '—';
    var k = kind();
    var u = sampleUnit();
    if (k === 'depth' && u === 'in') return fmt(v / 25.4, 3);
    if ((k === 'flow' || k === 'volume') && u === 'gph') return fmt(v / 3.785411784, 3);
    return fmt(v, 3);
  }
  function canonicalLabel() {
    var u = sampleUnit();
    var k = kind();
    if (k === 'depth') return t('Lámina', 'Depth') + ' (' + u + ')';
    if (k === 'volume') return t('Caudal', 'Flow') + ' (' + (imperial() ? 'gph' : 'L/h') + ')';
    return t('Caudal', 'Flow') + ' (' + u + ')';
  }
  function pressureUnit() { return imperial() ? 'PSI' : 'MCA'; }
  function flowUnit() { return imperial() ? 'gph' : 'L/h'; }
  function writeEuDisplay() {
    syncingEu = true;
    var qnEl = document.getElementById('eu-qn');
    if (qnEl) qnEl.value = imperial() ? U.round(euSi.qnLph / 3.785411784, 3) : euSi.qnLph;
    function p(id, mca) {
      var el = document.getElementById(id);
      if (el) el.value = imperial() ? U.round(U.mcaToPsi(mca), 2) : mca;
    }
    p('eu-pn', euSi.pnMca);
    p('eu-pin', euSi.pinMca);
    p('eu-fmain', euSi.fmainMca);
    p('eu-flat', euSi.flatMca);
    p('eu-slope', euSi.slopeMca);
    syncingEu = false;
  }
  function readEuDisplay() {
    if (syncingEu) return;
    var qn = Number(document.getElementById('eu-qn').value);
    if (Number.isFinite(qn)) euSi.qnLph = imperial() ? qn * 3.785411784 : qn;
    function p(id, key) {
      var n = Number(document.getElementById(id).value);
      if (!Number.isFinite(n)) return;
      euSi[key] = imperial() ? U.psiToMca(n) : n;
    }
    p('eu-pn', 'pnMca');
    p('eu-pin', 'pinMca');
    p('eu-fmain', 'fmainMca');
    p('eu-flat', 'flatMca');
    p('eu-slope', 'slopeMca');
  }
  function kindChanged() {
    document.querySelectorAll('.kind').forEach(function (el) {
      el.classList.toggle('active', el.getAttribute('data-kind') === kind());
    });
    document.querySelectorAll('.vol-only').forEach(function (el) {
      el.classList.toggle('hidden', kind() !== 'volume');
    });
    fillUnits();
    renderLots();
  }
  function analyzeOne(lot) {
    var samples = (lot.samples || []).map(function (s, i) {
      return { label: sampleLabel(i), value: s.value };
    });
    return U.analyzeLot(samples, extra());
  }
  function renderLotStats(lot, i) {
    var r = analyzeOne(lot);
    var host = document.getElementById('lot-stats-' + i);
    var tbody = document.querySelector('#lot-table-' + i + ' tbody');
    if (tbody) {
      Array.prototype.forEach.call(tbody.rows, function (tr, ri) {
        var row = r.rows && r.rows[ri];
        tr.classList.toggle('low', !!(row && row.lowQuarter));
        var qCell = tr.querySelector('[data-q]');
        var pCell = tr.querySelector('[data-p]');
        if (qCell) qCell.textContent = row && row.canonical != null ? fmtCanonical(row.canonical) : '—';
        if (pCell) pCell.textContent = row && row.pctOfMean != null ? fmt(row.pctOfMean, 0) + '%' : '—';
      });
    }
    if (!host) return;
    if (!r.ok) {

  function renderEu() {
    var hyd = U.designPressures({
      pinMca: euSi.pinMca,
      frictionMainMca: euSi.fmainMca,
      frictionLateralMca: euSi.flatMca,
      slopeFavorMca: euSi.slopeMca
    });
    var qn = euSi.qnLph;
    var pn = euSi.pnMca;
    var x = Number(document.getElementById('eu-x').value);
    var qmin = U.flowFromPressure(qn, hyd.pMin, pn, x);
    var qavg = U.flowFromPressure(qn, hyd.pAvg, pn, x);
    var qmax = U.flowFromPressure(qn, hyd.pMax, pn, x);
    var eu = U.emissionUniformity({
      cvf: document.getElementById('eu-cvf').value,
      ep: document.getElementById('eu-ep').value,
      qmin: qmin,
      qavg: qavg
    });
    var band = eu.ok ? U.duBand(eu.eu) : null;

    if (!hyd.ok) {
      host.innerHTML = '<p class="warn">' + coreErr(hyd.error) + '</p>';
      return;
    }
    host.innerHTML =
      '<div class="stats">' +
        '<div class="stat"><b>' + fmtPressure(hyd.pAB) + '</b><span>P A→B</span></div>' +
        '<div class="stat"><b>' + fmtPressure(hyd.pFirstEnd) + '</b><span>' + t('Fin 1ª lateral', 'End of 1st lateral') + '</span></div>' +
        '<div class="stat"><b>' + fmtPressure(hyd.pLastEnd) + '</b><span>' + t('P mín (último emisor)', 'P min (last emitter)') + '</span></div>' +
        '<div class="stat"><b>' + fmtPressure(hyd.pAvg) + '</b><span>P ' + t('media', 'avg') + '</span></div>' +
        '<div class="stat"><b>' + fmtPressure(hyd.pMax) + '</b><span>P máx</span></div>' +
        '<div class="stat"><b>' + fmtFlowLph(qmin) + '</b><span>q<sub>min</sub></span></div>' +
        '<div class="stat"><b>' + fmtFlowLph(qavg) + '</b><span>q̄</span></div>' +
        '<div class="stat"><b>' + fmtFlowLph(qmax) + '</b><span>q<sub>máx</sub></span></div>' +
      '</div>' +
          (eu.ok
        ? '<div class="eu-hero" style="color:' + (band && band.color || '#0f766e') + '">EU = ' + fmt(eu.eu, 1) + '%</div>' +
          '<p class="ok">q<sub>min</sub>/q̄ = ' + fmt(eu.qminOverQavg, 4) + ' · ' +
          t('factor de fabricación', 'manufacturer factor') + ' = ' + fmt(eu.manufacturerFactor, 4) +
          (band ? ' · ' + (prefs().language === 'en' ? band.labelEn : band.labelEs) : '') + '</p>' +
          '<p class="key">EU = 100 × (1 − 1.27 × CVf / √ep) × (q<sub>min</sub> / q̄)</p>' +
          (Math.abs(euSi.qnLph - 0.51) < 1e-6 && Math.abs(euSi.pnMca - 5.5) < 1e-6
            ? '<p class="intro">' + t(

  function applyPersistState(d) {
    if (!d || typeof d !== 'object') return;

      if (radio) radio.checked = true;
    }
    fillUnits(d.unit);
    if (d.catchMinutes != null) document.getElementById('ur-min').value = d.catchMinutes;
    if (d.irrigHours != null) document.getElementById('ur-hours').value = d.irrigHours;
    if (d.cvf != null) document.getElementById('ur-cvf').value = d.cvf;
    if (d.ep != null) document.getElementById('ur-ep').value = d.ep;
    function writeIf(id, val, kind) {
      if (val == null || val === '') return;
      var n = Number(val);
      if (!Number.isFinite(n)) return;
      if (UI && UI.write) UI.write(id, n, kind);
      else document.getElementById(id).value = n;
    }
    writeIf('ur-area', d.catchAreaCm2, 'small_area');
    writeIf('ur-row', d.rowM, 'spacing');
    writeIf('ur-emit', d.emitM, 'spacing');
    writeIf('ur-dose', d.doseKgHa, 'dose_mass_area');
    writeIf('ur-conc', d.concKgM3, 'concentration_mass_volume');
    if (d.eu) {
      if (d.eu.qn != null && d.eu.qn !== '') euSi.qnLph = Number(d.eu.qn);
      if (d.eu.pn != null && d.eu.pn !== '') euSi.pnMca = Number(d.eu.pn);
      if (d.eu.pin != null && d.eu.pin !== '') euSi.pinMca = Number(d.eu.pin);
      if (d.eu.fmain != null && d.eu.fmain !== '') euSi.fmainMca = Number(d.eu.fmain);
      if (d.eu.flat != null && d.eu.flat !== '') euSi.flatMca = Number(d.eu.flat);
      if (d.eu.slope != null && d.eu.slope !== '') euSi.slopeMca = Number(d.eu.slope);
      if (d.eu.x != null) document.getElementById('eu-x').value = d.eu.x;
      if (d.eu.cvf != null) document.getElementById('eu-cvf').value = d.eu.cvf;
      if (d.eu.ep != null) document.getElementById('eu-ep').value = d.eu.ep;
    }
    writeEuDisplay();
    if (Array.isArray(d.lots) && d.lots.length) {
      lots = d.lots.map(function (lot, i) {
        var samples = (lot.samples || []).map(function (s) {
          return { value: s && s.value != null ? s.value : '' };

        return { title: lot.title || (t('Lote', 'Plot') + ' ' + (i + 1)), samples: samples };

    renderEu();
  }

    });
    document.getElementById('ur-lots').addEventListener('click', function (e) {
      var add = e.target.closest('[data-add-row]');
      if (add) {
        var i = Number(add.getAttribute('data-add-row'));
        lots[i].samples.push({ value: '' });
        renderLots();
        return;
      }
      var delRow = e.target.closest('[data-del-row]');
      if (delRow) {
        var parts = delRow.getAttribute('data-del-row').split(':');
        var li = Number(parts[0]);
        var ri = Number(parts[1]);
        if (lots[li].samples.length > 1) lots[li].samples.splice(ri, 1);
        renderLots();
        return;
      }
      var delLot = e.target.closest('[data-del-lot]');
      if (delLot && lots.length > 1) {
        lots.splice(Number(delLot.getAttribute('data-del-lot')), 1);
        renderLots();
      }
    });
    ['ur-unit', 'ur-min', 'ur-area', 'ur-hours', 'ur-row', 'ur-emit', 'ur-dose', 'ur-conc', 'ur-cvf', 'ur-ep'].forEach(function (id) {
      document.getElementById(id).addEventListener('input', refreshAllStats);
      document.getElementById(id).addEventListener('change', refreshAllStats);
    });
    ['eu-qn', 'eu-pn', 'eu-x', 'eu-cvf', 'eu-ep', 'eu-pin', 'eu-fmain', 'eu-flat', 'eu-slope'].forEach(function (id) {
      document.getElementById(id).addEventListener('input', function () {
        readEuDisplay();
        renderEu();
      });
    });
    if (window.NpFreePersist && window.NpFreePersist.bind) {
      persist = window.NpFreePersist.bind('uniformidad_riego', getPersistState, applyPersistState);
    }
    if (readBound('ur-row', 'spacing') == null && UI && UI.write) UI.write('ur-row', 1.5, 'spacing');
    if (readBound('ur-emit', 'spacing') == null && UI && UI.write) UI.write('ur-emit', 0.3, 'spacing');
    writeEuDisplay();
    refreshCopy();
  });
})();
  </script>
</body>
</html>
